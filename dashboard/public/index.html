<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Smart Parking Management System</h1>
        <p>Real-time parking monitoring and allocation</p>
    </header>

    <main>

        <section class="stats">

            <div class="stat-card">
                <h2 id="totalSpaces">-</h2>
                <p>Total Spaces</p>
            </div>

            <div class="stat-card">
                <h2 id="occupiedSpaces">-</h2>
                <p>Occupied</p>
            </div>

            <div class="stat-card">
                <h2 id="availableSpaces">-</h2>
                <p>Available</p>
            </div>

        </section>

        <section class="panel">

            <div class="panel-header">
                <h2>Parking Spaces</h2>

                <button onclick="loadDashboard()">
                    Refresh
                </button>
            </div>

            <div id="parkingGrid" class="parking-grid">
                Loading parking spaces...
            </div>

        </section>

        <section class="panel">

            <h2>Reserve Parking</h2>

            <div class="reservation-form">

                <label for="userId">
                    User ID
                </label>

                <input
                    type="number"
                    id="userId"
                    value="1"
                    min="1"
                >

                <button onclick="reserveParking()">
                    Reserve Parking
                </button>

            </div>

            <div id="reservationResult"></div>

        </section>

        <section class="panel">

            <h2>Reservation Analytics</h2>

            <div class="analytics">

                <div>
                    <strong id="totalReservations">-</strong>
                    <span>Total Reservations</span>
                </div>

                <div>
                    <strong id="activeReservations">-</strong>
                    <span>Active Reservations</span>
                </div>

                <div>
                    <strong id="completedReservations">-</strong>
                    <span>Completed Reservations</span>
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>Smart Parking IoT System</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
