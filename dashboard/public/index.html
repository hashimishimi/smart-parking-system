<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ParkSense Smart Parking</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<header>

    <div>

        <h1>ParkSense</h1>

        <p>
            Smart Parking Management System
        </p>

    </div>

    <span
        id="status"
        class="status"
    >
        Connecting...
    </span>

</header>

<main>

    <section class="stats">

        <div class="card">

            <h3>Total Spaces</h3>

            <strong id="total">
                0
            </strong>

        </div>

        <div class="card">

            <h3>Available</h3>

            <strong id="available">
                0
            </strong>

        </div>

        <div class="card">

            <h3>Occupied</h3>

            <strong id="occupied">
                0
            </strong>

        </div>

        <div class="card">

            <h3>Reservations</h3>

            <strong id="reservations">
                0
            </strong>

        </div>

    </section>


    <section class="panel">

        <div class="panel-heading">

            <h2>
                Parking Spaces
            </h2>

            <button onclick="loadData()">
                Refresh
            </button>

        </div>

        <div
            id="spaces"
            class="spaces"
        ></div>

    </section>


    <section class="panel">

        <h2>
            Reserve a Space
        </h2>

        <div class="reserve-row">

            <input
                id="userId"
                type="number"
                value="1"
                min="1"
                placeholder="User ID"
            >

            <button onclick="reserveSpace()">
                Find & Reserve
            </button>

        </div>

        <p id="message"></p>

    </section>


    <section class="panel">

        <h2>
            Reservation Analytics
        </h2>

        <div id="analytics"></div>

    </section>

</main>

<script src="/config.js"></script>

<script src="/app.js"></script>

</body>

</html>
